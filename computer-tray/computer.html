<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SynthAI Computer Diagnostic</title><style>body{font-family:system-ui;background:#080b12;color:#eef;margin:0;padding:20px}main{max-width:900px;margin:auto}.card{background:#111725;border:1px solid #28314a;border-radius:16px;padding:16px;margin:12px 0}textarea{width:100%;min-height:120px;background:#090d16;color:#eef;border:1px solid #34405e;border-radius:10px;padding:10px;box-sizing:border-box}button{padding:10px 14px;border:0;border-radius:10px;background:#7c5cff;color:white}.ok{color:#8ff0b0}.bad{color:#ff9b9b}pre{white-space:pre-wrap;overflow:auto|</style></head><body><main><h1>SynthAI Computer</h1><p>Diagnostic shell connected to the Computer runtime. The shell is not the OS.</p><div class="card"><b id="status">booting…</b><pre id="summary"></pre></div><div class="card"><h2>Artifact → mount verification</h2><input id="name" value="diagnostic.txt"><textarea id="text">runtime input from diagnostic shell</textarea><p><button id="ingest">Ingest + mount</button></p><pre id="result"></pre></div></main><script type="module" src="./computer-diagnostic.mjs"></script></body></html>
