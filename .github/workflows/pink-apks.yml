name: pink-apks (native mesh + admin catalog)
on:
  workflow_dispatch:
  push:
    branches: [computer-apps-tray]
    paths: ['native-apps/pink-apks/**', '.github/workflows/pink-apks.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: native-apps/pink-apks/android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew && ./gradlew assembleDebug assembleAndroidTest --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: pink-apks-debug
          path: |
            native-apps/pink-apks/android/mesh/build/outputs/apk/debug/*.apk
            native-apps/pink-apks/android/catalog/build/outputs/apk/debug/*.apk
