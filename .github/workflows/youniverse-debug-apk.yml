name: YOU-N-I-VERSE Debug APK
on:
  push:
    branches: [main]
    paths: ['you-n-i-verse/**', 'android/**', '.github/workflows/youniverse-debug-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: youniverse-debug-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Retain debug signing key for subsequent installs
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: youniverse-debug-signing-v1
      - name: Install build SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Check JavaScript engines
        run: |
          node you-n-i-verse/test.mjs
          node you-n-i-verse/studio.test.mjs
          node --check you-n-i-verse/studio.mjs
      - name: Build debug APK
        run: gradle -p android --no-daemon assembleDebug -PbuildNumber=${{ github.run_number }}
      - name: Name installable APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk YOU-N-I-VERSE-debug.apk
      - name: Keep build artifact
        uses: actions/upload-artifact@v4
        with:
          name: YOU-N-I-VERSE-debug-apk
          path: YOU-N-I-VERSE-debug.apk
          retention-days: 30
      - name: Publish direct APK download
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tag = 'youniverse-debug-' + context.sha.slice(0, 12);
            let release;
            try { release = (await github.rest.repos.getReleaseByTag({...context.repo, tag})).data; }
            catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                ...context.repo, tag_name: tag, target_commitish: context.sha,
                name: 'YOU-N-I-VERSE Debug · ' + context.sha.slice(0, 7),
                prerelease: true,
                body: 'Download YOU-N-I-VERSE-debug.apk below and open it on Android 8 or newer. Allow installation from your browser or Files app if Android asks. This debug build includes the local photo studio, device project storage, camera/file picker and native exports. Morphing is still a prototype. Source commit: ' + context.sha
              })).data;
            }
            const existing = (await github.rest.repos.listReleaseAssets({...context.repo, release_id: release.id})).data;
            if (!existing.some(a => a.name === 'YOU-N-I-VERSE-debug.apk')) {
              await github.rest.repos.uploadReleaseAsset({...context.repo, release_id: release.id, name: 'YOU-N-I-VERSE-debug.apk', data: fs.readFileSync('YOU-N-I-VERSE-debug.apk'), headers: {'content-type':'application/vnd.android.package-archive'}});
            }
