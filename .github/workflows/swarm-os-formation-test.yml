name: SWARM-OS Executable Formation Check
on:
  push:
    branches: [swarm-os-formation-spine-20261016]
    paths:
      - 'you-n-i-verse/formation-spine.mjs'
      - 'you-n-i-verse/formation-spine.test.mjs'
      - 'you-n-i-verse/formation-klein.test.mjs'
      - '.github/workflows/swarm-os-formation-test.yml'
  pull_request:
    paths:
      - 'you-n-i-verse/formation-spine.mjs'
      - 'you-n-i-verse/formation-spine.test.mjs'
      - 'you-n-i-verse/formation-klein.test.mjs'
      - '.github/workflows/swarm-os-formation-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check you-n-i-verse/formation-spine.mjs
          node --check you-n-i-verse/formation-spine.test.mjs
      - name: Formation morph execution tests
        run: node --test you-n-i-verse/formation-spine.test.mjs you-n-i-verse/formation-klein.test.mjs
      - name: Existing local world bridge regression
        run: node --test you-n-i-verse/test.mjs
